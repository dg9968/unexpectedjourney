services:
  - type: web
    name: unexpected-journey
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: node dist/standalone/server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: unexpected-journey-db
          property: connectionString
      - key: ADMIN_SECRET
        sync: false

databases:
  - name: unexpected-journey-db
    databaseName: unexpected_journey
    user: unexpected_journey
